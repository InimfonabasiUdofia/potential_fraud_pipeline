services:
  airflow:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/dataset
      - ./output:/opt/airflow/output
    environment:
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"    
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"            